name: Generar serpiente de contribuciones

on:
  # Se ejecuta solo una vez al día (a medianoche UTC)
  schedule:
    - cron: "0 0 * * *"
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:
  # Y cada vez que subas cambios a main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generar las animaciones SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00C7B7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00C7B7

      - name: Subir los SVG a la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
